<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>the den — classic radio</title>
<meta name="description" content="the den — a vintage radio playing only classic songs, with live visualizer backgrounds." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="viz" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <img src="logo.svg" alt="the den" class="brand-logo" />
  <div class="viz-picker" id="vizPicker" title="Visualizer background"></div>
</header>

<main id="ui">
  <div class="radio" id="radio">
    <div class="cabinet-sheen" aria-hidden="true"></div>

    <div class="radio-top">
      <div class="brand-plate">✦ THE DEN ✦<small>classic radio · est. static-free</small></div>
      <div class="dial" id="dial">
        <div class="dial-scale" id="dialScale"></div>
        <div class="needle" id="needle"></div>
        <div class="dial-glass" aria-hidden="true"></div>
      </div>
      <div class="lcd" id="lcd">
        <div class="lcd-row">
          <span id="lcdLive" class="lcd-live hidden">● LIVE</span>
          <span id="lcdStation">— pick a station —</span>
        </div>
        <div class="lcd-row dim">
          <span id="lcdFreq">87.5 MHz</span>
          <span id="lcdSleep"></span>
          <span id="lcdClock">--:--</span>
        </div>
        <div class="lcd-status" id="lcdStatus">press power ⏻</div>
      </div>
    </div>

    <div class="radio-mid">
      <div class="grille" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="presets" id="presetBtns"></div>
    </div>

    <div class="radio-bottom">
      <div class="knob-block">
        <div class="knob" id="knobPower" role="button" tabindex="0" title="Power"><span></span></div>
        <label>power</label>
      </div>
      <div class="knob-block">
        <div class="knob big" id="knobVol" title="Volume — drag or scroll"><span></span></div>
        <label>volume</label>
      </div>
      <div class="knob-block">
        <div class="tune-btns">
          <button id="btnPrevTune" title="Previous station">◀</button>
          <button id="btnNextTune" title="Next station">▶</button>
        </div>
        <label>tuning</label>
      </div>
      <div class="knob-block">
        <div class="knob" id="knobSleep" role="button" tabindex="0" title="Sleep timer"><span></span></div>
        <label id="sleepLabel">sleep · off</label>
      </div>
    </div>
  </div>

  <p class="hint">space — play/pause · ←/→ — station · ↑/↓ — volume · H — hide</p>
  <p class="credit">live streams via SomaFM (listener-supported) · press a preset to play</p>
</main>

<button id="showUi" class="hidden">show radio</button>

<script src="app.js"></script>
</body>
</html>
